workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: Codemagic-Makarska-Dining
    
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.makarska.dining
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 18
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      
      - name: Build web app
        script: |
          mkdir -p dist
          npm run build
          echo "--- dist contents (must include styles.css + js/) ---"
          ls -la dist
          ls -la dist/js
      
      - name: Add iOS platform
        script: |
          npx cap add ios || true
      
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      
      - name: Set up app icons
        script: |
          cp -r assets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/
          echo "✅ App icons installed"
      
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      
      - name: Set version and build number
        script: |
          # Marketing version comes from package.json (single source of truth).
          # Build number is a unique timestamp so every upload is accepted.
          VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all $(date +%Y%m%d%H%M%S)
          echo "✅ Marketing version $VERSION, build $(agvtool what-version -terse)"
      
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Inject iOS permission strings
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'This app needs camera access to take photos of restaurants and food items.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'This app needs camera access to take photos of restaurants and food items.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'This app needs photo library access to select photos of restaurants and food items.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'This app needs photo library access to select photos of restaurants and food items.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'This app needs to save photos to your photo library.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'This app needs to save photos to your photo library.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "✅ Permission strings injected"

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.makarska.dining"
      node: 18
      java: 17
    
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      
      - name: Build web app
        script: |
          mkdir -p dist
          npm run build
      
      - name: Add Android platform
        script: |
          npx cap add android || true
      
      - name: Sync Capacitor
        script: |
          npx cap sync android
      
      - name: Build Android APK/AAB
        script: |
          cd android
          ./gradlew bundleRelease
    
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
